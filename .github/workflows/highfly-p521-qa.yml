name: HIGHFLY P521 WORLD FORGE (No World Overwrite)
on:
  push:
    branches: [p521-world-forge-lite-20261124]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-p521-qa
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked P5.1 icon image dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Static JavaScript and safety tests
        run: |
          node --check scripts/f0-build.mjs
          node --check public/highfly/world-forge.js
          node --check src/highfly/p521-resume-position.mjs
          node --check src/highfly/p521-world-forge-runtime.mjs
          node --check src/highfly/es-localization.mjs
          node --check src/highfly/premium-rpg.mjs
          node --test tests/p521-world-forge.test.mjs
          node --test tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
          npm run qa:static
          npm run qa:gameplay
      - name: Compile full HIGHFLY plus lightweight World Forge
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p521/ npm run build
          npm run qa:dist
          test -s dist/index.html
          test -s dist/highfly/world-forge.html
          test -s dist/highfly/world-forge.js
          test -s .work/unsung/src/highfly/p521-world-forge-runtime.mjs
          test -s .work/unsung/src/highfly/p521-resume-position.mjs
          grep -q 'installHighflyWorldForge' .work/unsung/src/main.js
          grep -q 'installHighflyResume' .work/unsung/src/main.js
          grep -q 'translateHighfly(m.name)' .work/unsung/src/ui/ui.js
          grep -q 'highfly-unsung-resume-v1' .work/unsung/src/game/game.js
          grep -q 'preview-p521' dist/index.html
          ! git diff --name-only | grep -qE '^src/world/(layout|terrain|arch)/'
      - name: Upload independent compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p521-world-forge-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
