name: "HIGHFLY P538 Arvelia — isolated Eastbrook pilot QA"
on:
  push:
    branches: [p538-eastbrook-land-npcs-pilot-20261125]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p538-isolated-pages
  cancel-in-progress: true
jobs:
  arvelia-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare frozen image tool dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Strict static checks and focused Arvelia quests
        run: |
          node --check src/highfly/p538-eastbrook-land.mjs
          node --check src/highfly/p538-arvelia-quests.mjs
          node --check src/highfly/p525-world-forge-3d.mjs
          node --check src/highfly/p521-world-forge-runtime.mjs
          node --check scripts/f0-build.mjs
          node --check tests/p538-browser-eastbrook.mjs
          node --test tests/p538-eastbrook-land.test.mjs
          node --test tests/p537-ground-fit.test.mjs
          node --test tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
      - name: Rebuild P538 isolated full RPG and 3D World Forge (do NOT deploy Pages)
        shell: bash
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p538/ npm run build
          npm run qa:dist
          grep -q 'preview-p538' dist/index.html
          grep -q 'WORLD FORGE 4.6' dist/highfly/world-forge-3d.html
          grep -q 'p538-eastbrook-land' .work/unsung/src/highfly/p525-world-forge-3d.mjs
          grep -q 'p538-arvelia-quests' .work/unsung/src/highfly/p521-world-forge-runtime.mjs
          test -s dist/highfly/native-overview.json
          test -s dist/highfly/world-forge-3d.js
          ! find dist -type f | grep -E '(KIT_COMPLETO|KAYKIT_SOURCE_EDITOR_V1_PRIVATE|fragmento_0[12]\.bin)'
      - name: Inspect actual Unsung terrain and Eastbrook 3D placement in software Chrome
        shell: bash
        run: |
          cp tests/p538-browser-eastbrook.mjs .work/unsung/tools/p538-browser-eastbrook.mjs
          cd .work/unsung
          timeout 250s node tools/p538-browser-eastbrook.mjs
      - name: Upload terrain placement evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p538-eastbrook-terrain-and-npc-qa
          path: |
            .work/unsung/p538-eastbrook-qa.json
            .work/unsung/p538-eastbrook-placed.json
            .work/unsung/p538-eastbrook-editor.png
          if-no-files-found: warn
          retention-days: 7
      - name: Keep isolated PREVIEW BUILD only after strict tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p538-arvelia-world-forge
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish-pages:
    needs: [arvelia-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download freshly tested P538 Arvelia build
        uses: actions/download-artifact@v4
        with:
          name: highfly-p538-arvelia-world-forge
          path: ${{ runner.temp }}/p538-tested
      - name: Download previous P537 approved backup without modifying its branch
        uses: actions/download-artifact@v4
        with:
          name: highfly-p537-world-forge-45
          run-id: 45659850899
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p537-approved
      - name: Assemble only P537 backup + P538 new World Forge and RPG for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/p537-approved"
          NEW="$RUNNER_TEMP/p538-tested"
          ROOT="$RUNNER_TEMP/p538-pages"
          test -s "$OLD/index.html"
          test -s "$OLD/highfly/world-forge-3d.html"
          test -s "$NEW/index.html"
          test -s "$NEW/highfly/world-forge-3d.html"
          grep -q 'preview-p537' "$OLD/index.html"
          grep -q 'preview-p538' "$NEW/index.html"
          grep -q 'WORLD FORGE 4.6' "$NEW/highfly/world-forge-3d.html"
          mkdir -p "$ROOT/preview-p537" "$ROOT/preview-p538"
          cp -a "$OLD/." "$ROOT/preview-p537/"
          cp -a "$NEW/." "$ROOT/preview-p538/"
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html>
          <html lang="es"><meta charset="utf-8"><title>HIGHFLY P5.3.8 — ARVELIA</title>
          <meta http-equiv="refresh" content="0;url=./preview-p538/">
          <a href="./preview-p538/">Entrar a HIGHFLY P5.3.8 · Arvelia</a></html>
          HTML
          touch "$ROOT/.nojekyll"
          test -s "$ROOT/preview-p538/index.html"
          test -s "$ROOT/preview-p538/highfly/world-forge-3d.js"
          test -s "$ROOT/preview-p537/highfly/world-forge-3d.html"
          test ! -e "$ROOT/preview-p536"
          test ! -e "$ROOT/preview-p534"
          SIZE="$(du -sb "$ROOT" | cut -f1)"
          echo "P538 PAGES SIZE: $SIZE bytes (P537 backed up + P538 new only)"
          test "$SIZE" -lt 900000000 || { echo "::error::Pages site exceeds 900MB"; exit 1; }
          mv "$ROOT" dist-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
