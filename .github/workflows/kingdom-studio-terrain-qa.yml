name: Kingdom Builder K0.4 — Comparación visual 2D y 3D
on:
  push:
    branches: [world-forge-kingdom-builder]
    paths: ['.github/workflows/kingdom-studio-terrain-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kingdom-studio-k04-terrain
          run-id: 46002343855
          github-token: ${{ github.token }}
          path: site/HIGHFLY-FREE-FOUNDATION/kingdom-studio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comparar geografía en pantalla y abrir ciudades 3D
        run: |
          mkdir -p evidence
          ROOT=site/HIGHFLY-FREE-FOUNDATION/kingdom-studio
          mkdir -p "$ROOT/town/33"
          cp "$ROOT/index.html" "$ROOT/town/33/index.html"
          python3 -m http.server 8765 --directory site >/tmp/server.log 2>&1 &
          cat > smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const base='http://127.0.0.1:8765/HIGHFLY-FREE-FOUNDATION/kingdom-studio/';
          const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          const errors=[],bad=[],results=[];
          const observe=p=>{p.on('pageerror',e=>errors.push(e.message));p.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400)bad.push(r.status()+' '+r.url())})};
          observe(page);
          try{
            await page.goto(base+'lab/hexmap/?seed=33',{waitUntil:'domcontentloaded'});
            const selector=page.getByLabel('Especialización',{exact:true});
            await selector.waitFor({timeout:30000});
            const themes=['puertaria','ferrondral','sylvaris','valdoria'];
            for(const theme of themes){
              await selector.selectOption(theme);
              await page.waitForFunction(t=>new URL(location.href).searchParams.get('theme')===t,theme);
              const q=await page.evaluate(()=>Object.fromEntries(new URL(location.href).searchParams));
              if(!q.hills||!q.rain||!q.files||!q.cliffs)throw Error('Preset incompleto '+JSON.stringify(q));
              const info=await page.locator('body').innerText();
              await page.screenshot({path:'evidence/'+theme+'-2d.png'});
              results.push({theme,q,info:info.slice(0,2000)});
            }
            const port=results[0].q,mine=results[1].q;
            if(!(Number(port.rain)>Number(mine.rain)&&Number(mine.hills)>Number(port.hills)))throw Error('El selector no cambia geografía');
            await selector.selectOption('ferrondral');
            await page.waitForFunction(()=>new URL(location.href).searchParams.get('theme')==='ferrondral');
            const target=page.getByText('Abrir en 3D',{exact:true});
            await target.click();
            await page.waitForURL(u=>u.pathname.includes('/town/33')&&u.searchParams.get('theme')==='ferrondral',{timeout:30000});
            await page.close();
            for(const theme of ['ferrondral','puertaria']){
              const p=await browser.newPage({viewport:{width:800,height:450},deviceScaleFactor:1});
              observe(p);
              await p.goto(base+'town/33/?theme='+theme,{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForSelector('[data-screen="town"]',{timeout:60000});
              await p.waitForFunction(()=>typeof window.guildhall?.ready==='function',{timeout:60000});
              await p.evaluate(()=>Promise.race([window.guildhall.ready(),new Promise((_,rej)=>setTimeout(()=>rej(Error('ready timeout')),180000))]));
              await p.waitForFunction(()=>{try{const p=window.guildhall.perf.now();return p.calls>0&&p.tris>0}catch{return false}},{timeout:120000});
              const stats=await p.evaluate(()=>window.guildhall.perf.now());
              await p.screenshot({path:'evidence/'+theme+'-3d.png',timeout:120000});
              results.push({theme,stats});
              await p.close();
            }
            if(errors.length||bad.length)throw Error(JSON.stringify({errors,bad}));
          }catch(e){console.error(e);process.exitCode=1}
          finally{await fs.writeFile('evidence/results.json',JSON.stringify({results,errors,bad},null,2));await browser.close()}
          JS
          node smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdom-k04-visual-evidence
          path: evidence
          if-no-files-found: warn
