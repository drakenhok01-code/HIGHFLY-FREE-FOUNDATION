name: "HIGHFLY P524 - Original KayKit FREE CC0 + Map QA (No Deploy)"
on:
  push:
    branches: [p524-world-forge-kaykit-free-buildings-20261124]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-p524-kaykit-free-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact PIL/numpy for original terrain and model thumbnails
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Protected regression + KayKit CC0 checks
        run: |
          node --check public/highfly/world-forge.js
          node --check src/highfly/p521-world-forge-runtime.mjs
          node --check scripts/p524-kaykit-free-buildings.mjs
          node --test tests/p524-free-kaykit-buildings.test.mjs tests/p523-png-terrain.test.mjs tests/p521-world-forge.test.mjs tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
          npm run qa:static
          npm run qa:gameplay
      - name: Build frozen real Unsung + frozen CC0 Medieval Hexagon
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p524/ npm run build
          npm run qa:dist
          test -s dist/highfly/native-terrain-core.png
          test -s dist/highfly/native-terrain-region.png
          test -s dist/highfly/native-overview.json
          test -s dist/highfly/kaykit-free/manifest.json
          test -s dist/highfly/kaykit-free/LICENSE-KAYKIT-MEDIEVAL-HEXAGON-CC0.txt
          grep -q 'preview-p524' dist/index.html
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/highfly/kaykit-free/manifest.json'));if(m.models.length!==16||m.license!=='CC0-1.0'||m.commit!=='84fa4e91af6a88989be7c99e0891cede11f2ca38')throw Error('KayKit public-pack provenance mismatch');for(const a of m.models){for(const ext of ['.gltf','.bin'])if(!fs.statSync('dist/highfly/kaykit-free/'+a.model.replace('.gltf',ext)).size)throw Error('Missing real glTF model '+a.name);if(!fs.statSync('dist/highfly/kaykit-free/thumbs/'+a.model.replace('.gltf','.png')).size)throw Error('Missing actual prefab thumbnail '+a.name)}console.log('PASS: 16 official free CC0 glTF models + 16 real thumbnails')"
          test -s dist/highfly/world-forge.js
          grep -q 'kaykit-free/thumbs' dist/highfly/world-forge.js
          ! grep -q 'DecompressionStream' dist/highfly/world-forge.js
      - name: Save tested independently playable P524 bundle
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p524-actual-kaykit-cc0-buildings
          path: dist/
          retention-days: 5
          if-no-files-found: error
