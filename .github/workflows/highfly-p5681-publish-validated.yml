name: HIGHFLY P568.1 — Publish validated build
on:
  push:
    branches: [p568-phoenix-air-sea-20261126]
    paths: ['.github/workflows/highfly-p5681-publish-validated.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p555-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify exact tested commit and successful workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45902130784" | jq -e '.conclusion == "success" and .head_sha == "efb9c721ea01507290e63d5d18fccdbe79a2f39e"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45902255089" | jq -e '.conclusion == "success" and .head_sha == "f149d82830e1b3f5e3f84633ed6205a039bb6081"'
      - uses: actions/download-artifact@v4
        with:
          name: highfly-p568-pages
          run-id: 45901283917
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: highfly-p5681-build
          run-id: 45902130784
          github-token: ${{ github.token }}
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: highfly-p5681-smoke
          run-id: 45902130784
          github-token: ${{ github.token }}
          path: smoke
      - name: Replace only experimental preview after functional checks
        run: |
          set -euo pipefail
          mkdir site
          TAR="$(find previous -name artifact.tar -type f -print -quit)"
          test -n "$TAR"
          tar -xf "$TAR" -C site
          test -s site/preview-p543/index.html
          test -s site/preview-p55/index.html
          rm -rf site/preview-p55
          cp -a new site/preview-p55
          cp smoke/p564-smoke.json smoke/p564-mobility.json site/preview-p55/highfly/
          test -s site/preview-p55/highfly/p564/atlas.json
          for OLD in 541 542; do
            if [ "$(du -sb site | cut -f1)" -ge 950000000 ]; then rm -rf "site/preview-p$OLD"; fi
          done
          test "$(du -sb site | cut -f1)" -lt 950000000
          printf '%s\n' '{"version":"5.6.8.1","testedCommit":"efb9c721ea01507290e63d5d18fccdbe79a2f39e","validationRun":45902130784}' > site/preview-p55/highfly/release-p5681.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: highfly-p5681-pages
          path: site
      - name: Wait for artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            N="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="highfly-p5681-pages")] | length' 2>/dev/null || echo 0)"
            if [ "$N" = 1 ]; then sleep 20; exit 0; fi
            sleep 6
          done
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: highfly-p5681-pages
