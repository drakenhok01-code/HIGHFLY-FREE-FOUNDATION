name: Kingdom Builder K0.2.2 — Prueba real de los nueve módulos
on:
  push:
    branches: [world-forge-kingdom-builder]
    paths:
      - '.github/workflows/kingdom-studio-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kingdom-studio-k02-native
          run-id: 45993413135
          github-token: ${{ github.token }}
          path: site/HIGHFLY-FREE-FOUNDATION/kingdom-studio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Abrir y validar las nueve herramientas
        shell: bash
        run: |
          python3 -m http.server 8765 --directory site > /tmp/kingdom-server.log 2>&1 &
          mkdir -p evidence
          cat > smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const base='http://127.0.0.1:8765/HIGHFLY-FREE-FOUNDATION/kingdom-studio/';
          const routes=[['home','studio'],['hexmap','lab/hexmap'],['town','town?seed=7'],['pieces','pieces'],['palette','palette'],['composer','composer'],['hextiles','lab/hextiles'],['npc','npcs'],['grip','grips/editor'],['grips','grips']];
          const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const results=[];
          for(const [id,route] of routes){
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[],bad=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400)bad.push(r.status()+' '+r.url())});
            page.on('requestfailed',r=>{if(r.url().startsWith(base)&&r.failure()?.errorText!=='net::ERR_ABORTED')bad.push(r.failure()?.errorText+' '+r.url())});
            let error=null;
            try{
              const [p,q]=route.split('?');
              await page.goto(base+p+'/'+(q?'?'+q:''),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('[data-screen="'+id+'"]',{timeout:30000});
              await page.waitForFunction(()=>typeof window.guildhall?.ready==='function',{timeout:30000});
              await page.evaluate(()=>Promise.race([window.guildhall.ready(),new Promise((_,reject)=>setTimeout(()=>reject(Error('ready timeout')),90000))]));
              await page.waitForTimeout(1000);
              const info=await page.evaluate(()=>({text:document.body.innerText.slice(0,500),canvases:document.querySelectorAll('canvas').length}));
              if(id!=='home'&&!info.canvases)throw Error('No se encontró canvas: '+info.text);
              if(/Run bun import|Lost at sea|Library not found/i.test(info.text))throw Error(info.text);
              await page.screenshot({path:'evidence/'+id+'.png'});
              results.push({id,info,errors,bad,ok:!errors.length&&!bad.length});
            }catch(e){error=String(e);await page.screenshot({path:'evidence/'+id+'-error.png'}).catch(()=>{});results.push({id,error,errors,bad,ok:false})}
            await page.close();
          }
          await browser.close();
          await fs.writeFile('evidence/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          if(results.some(x=>!x.ok))process.exitCode=1;
          JS
          node smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdom-k022-browser-evidence
          path: evidence
          if-no-files-found: warn
