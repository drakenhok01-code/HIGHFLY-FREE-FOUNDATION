name: "HIGHFLY P533 — World Forge 4.3: Curved stone paths + full public CC0 models + REAL Unsung"
on:
  push:
    branches: [p533-curved-cobble-unsung-real-forest-20261125]
    paths: ['.github/workflows/highfly-p533-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p533-pages-safe
  cancel-in-progress: false
jobs:
  stage-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Retrieve P533 browser-validated game+editor with actual curved cobbles and native grass/tree rendering
        uses: actions/download-artifact@v4
        with:
          name: highfly-p533-public-curved-roads
          run-id: 45604332832
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p533-chrome-validated
      - name: Recover previously published P531 site including all approved prior previews
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 45567893895
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p531-approved-site
      - name: Verify P533 combined game, 221 KayKit FREE, 42 Quaternius CC0, curved roads, privacy and original Unsung
        shell: bash
        run: |
          set -euo pipefail
          GAME="$RUNNER_TEMP/p533-chrome-validated"
          for path in index.html highfly/world-forge.html highfly/world-forge.js highfly/world-forge-3d.html highfly/world-forge-3d.js highfly/p533-curved-road-path.mjs highfly/quaternius-cc0/manifest.json highfly/quaternius-cc0/props/well.glb highfly/unsung-flora/thumbs/unsung-tree-blossom.svg highfly/native-architecture-3d.bin highfly/native-architecture-3d.json highfly/native-terrain-core.png highfly/native-terrain-region.png highfly/native-overview.json highfly/kaykit-free/manifest.json highfly/kaykit-free/all-manifest.json highfly/kaykit-free/all/buildings/blue/building_home_A_blue.gltf highfly/kaykit-free/all/decoration/props/barrel.gltf highfly/kaykit-free/thumbs-all/buildings-blue-building-home-a-blue.png highfly/unsung-original-prefabs.json highfly/unsung-original-prefabs.bin highfly/unsung-original/thumbs/unsung-bench.png; do
            test -s "$GAME/$path" || { echo "FAIL: Missing P533 $path"; exit 1; }
          done
          grep -q 'preview-p533' "$GAME/index.html"
          grep -q 'WORLD FORGE 4.3 · P5.3.2+P5.3.3' "$GAME/highfly/world-forge-3d.html"
          grep -q 'p533' "$GAME/highfly/world-forge-3d.js"
          GAME="$GAME" node --input-type=module -e "import fs from 'node:fs';const p=process.env.GAME;const m=JSON.parse(fs.readFileSync(p+'/highfly/native-architecture-3d.json'));const k=JSON.parse(fs.readFileSync(p+'/highfly/kaykit-free/manifest.json'));if(m.meshes.length!==73||m.totalTriangles<800000||fs.statSync(p+'/highfly/native-architecture-3d.bin').size!==m.byteLength||k.license!=='CC0-1.0'||k.models.length!==16)throw Error('P533 missing real Unsung or KayKit CC0 geometry');console.log('P533 PASS: authentic Unsung architecture and original KayKit FREE models');"
          GAME="$GAME" node --input-type=module -e "import fs from 'node:fs';const d=process.env.GAME;const m=JSON.parse(fs.readFileSync(d+'/highfly/kaykit-free/all-manifest.json'));if(m.license!=='CC0-1.0'||m.models.length!==221||new Set(m.models.map(x=>x.id)).size!==221||m.models.filter(x=>x.kind==='building').length!==72)throw Error('P533 incomplete FREE catalog');console.log('P533 221 REAL FREE CC0 MODEL PASS');"
          GAME="$GAME" node --input-type=module -e "import fs from 'node:fs';const p=process.env.GAME,q=JSON.parse(fs.readFileSync(p+'/highfly/quaternius-cc0/manifest.json'));if(q.license!=='CC0-1.0'||q.models.length!==42)throw Error('Missing 42 legal Quaternius CC0 GLBs');console.log('P533 QUATERNIUS CC0 PASS',q.models.length)"
          test -s "$GAME/highfly/basis/basis_transcoder.wasm"
          test ! -e "$GAME/KIT_COMPLETO_PARTE_01.zip"
          test ! -e "$GAME/KIT_COMPLETO_PARTE_02.zip"
          test ! -e "$GAME/HIGHFLY_KAYKIT_SOURCE_EDITOR_V1_PRIVATE.zip"
          SITE="$RUNNER_TEMP/highfly-historical-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/p531-approved-site/artifact.tar" -C "$SITE"
          for rel in index.html preview-v3/index.html preview-p514/index.html preview-p520/index.html preview-p521/index.html preview-p522/index.html preview-p523/index.html preview-p524/index.html preview-p525/index.html preview-p526/index.html preview-p527/index.html preview-p529/index.html preview-p530/index.html preview-p531/index.html; do
            test -s "$SITE/$rel" || { echo "FAIL: Historical HIGHFLY file missing: $rel"; exit 1; }
          done
          test ! -e "$SITE/preview-p533"
          (cd "$SITE" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/unchanged-older-versions.sha256"
          mkdir -p "$SITE/preview-p533"
          cp -a "$GAME/." "$SITE/preview-p533/"
          (cd "$SITE" && sha256sum -c "$RUNNER_TEMP/unchanged-older-versions.sha256" >/dev/null)
          touch "$SITE/.nojekyll"
          mv "$SITE" dist-pages
          echo "P533 SAFE: All approved older files hash-identical. New World Forge 4.3 Curved Cobblestone Roads + Real Unsung RPG at preview-p533."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: stage-site
    runs-on: ubuntu-latest
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated P533 REAL Unsung RPG and World Forge 4.3 with 3D cobblestone spline roads
        id: deployment
        uses: actions/deploy-pages@v4
