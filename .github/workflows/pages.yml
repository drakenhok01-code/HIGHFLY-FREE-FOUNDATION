name: HIGHFLY FREE - Unsung original Android baseline
on:
  workflow_dispatch:
  push:
    branches: [free-foundation-v01, f04-unified-actor-lab]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: highfly-free-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar fuente y pruebas
        run: |
          npm run qa:static
          npm run qa:gameplay
      - name: Compilar Unsung original congelado
        run: npm run build
      - name: Simular movimiento real sobre el Player original
        run: node --test tests/integrated.test.mjs
      - name: Renderizar KayKit real en Chromium / WebGL
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          cd .work/unsung
          npm install --no-save --no-package-lock playwright@1.57.0 --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium --with-deps
          node scripts/qa-browser.mjs
      - name: Guardar pruebas visuales de personaje
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-kaykit-webgl-smoke
          path: |
            .work/unsung/qa-kaykit.png
            .work/unsung/qa-kaykit-report.json
          if-no-files-found: ignore
      - name: Auditar dist antes de publicar
        run: npm run qa:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/free-foundation-v01'
    environment:
      name: highfly-free-preview
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
