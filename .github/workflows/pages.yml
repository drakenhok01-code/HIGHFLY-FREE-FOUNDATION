name: HIGHFLY FREE - Unsung original Android baseline
on:
  workflow_dispatch:
  push:
    branches: [free-foundation-v01, f04-unified-actor-lab, f05-body-visibility-lab, f07-overlay-visibility-lab, f08-clean-universal-hero, f081-look-and-hud-cleanup, f09-universal-motion-lab, f010-weapon-motion-lab, f011-combat-motion-climb-swim, f0114-climb-combat-terrain-lab, f0116-emberfall-combat-dive-lab, f012-flow-combat-hud-dive-lab, f0122-directional-attack-hud-slope-oxygen, f013-unified-highfly-upgrade, f0131-android-visual-foundation, f014-premium-rpg-ui-lab, lab-f0148-phoenix-premium-real-v2, lab-f0148-phoenix-final-art-v3-20261120]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: highfly-f014-premium-qa-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar procesado de iconos WebP con transparencia real
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Auditar fuente y pruebas
        run: |
          npm run qa:static
          npm run qa:gameplay
          node --test tests/rpg-core.test.mjs tests/rpg-equipment.test.mjs tests/system-dialog.test.mjs tests/itemization.test.mjs
      - name: Compilar Unsung original congelado
        run: npm run build
      - name: Simular movimiento real sobre el Player original
        run: |
          node --test tests/cliff-camera.test.mjs tests/integrated.test.mjs tests/universal-motion.test.mjs tests/context-actions.test.mjs tests/unified-systems.test.mjs tests/localization.test.mjs tests/professions.test.mjs tests/professions-integration.test.mjs tests/profession-yard.test.mjs tests/locale-integrated.test.mjs
      - name: Auditar familia completa KayKit FREE (5 GLB reales)
        run: node scripts/qa-free-rigs.mjs
      - name: Renderizar KayKit real en Chromium / WebGL
        # Gate ALL releases, including Pages, with actual WebGL skin rasterization
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          cd .work/unsung
          npm install --no-save --no-package-lock playwright@1.57.0 --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium --with-deps
          node scripts/qa-browser.mjs
          node scripts/qa-rpg-browser.mjs
      - name: Guardar pruebas visuales de personaje
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-kaykit-webgl-smoke
          path: |
            .work/unsung/qa-kaykit.png
            .work/unsung/qa-kaykit-report.json
            .work/unsung/qa-world-kaykit.png
            .work/unsung/qa-world-kaykit-report.json
            .work/unsung/qa-touch-mobile.png
            .work/unsung/qa-touch-report.json
            .work/unsung/qa-rpg-intro.png
            .work/unsung/qa-rpg-character.png
            .work/unsung/qa-rpg-bag.png
            .work/unsung/qa-rpg-attributes.png
            .work/unsung/qa-rpg-forge.png
            .work/unsung/qa-rpg-professions.png
            .work/unsung/qa-rpg-quests.png
            .work/unsung/qa-rpg-map.png
            .work/unsung/qa-rpg-skills.png
            .work/unsung/qa-rpg-options.png
            .work/unsung/qa-rpg-report.json
          if-no-files-found: ignore
      - name: Auditar dist antes de publicar
        run: npm run qa:dist
      # Publish an isolated interactive preview on the SAME GitHub Pages site.
      # Rebuild the clean F0.14.8 root, and place this branch's game at /preview-v3/.
      # Thus root /HIGHFLY-FREE-FOUNDATION/ never contains experimental v3 art.
      - name: Empaquetar Pages estable y laboratorio separados
        if: github.ref == 'refs/heads/lab-f0148-phoenix-final-art-v3-20261120'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/highfly-premium-v3-preview"
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-v3/ npm run build
          cp -a dist/. "$RUNNER_TEMP/highfly-premium-v3-preview/"
          git fetch --depth=1 origin 38e59550766b0914652eb7412393f91b298e29f6
          git worktree add --detach "$RUNNER_TEMP/highfly-f0148-pristine" 38e59550766b0914652eb7412393f91b298e29f6
          cd "$RUNNER_TEMP/highfly-f0148-pristine"
          npm run build
          npm run qa:dist
          cd "$GITHUB_WORKSPACE"
          rm -rf dist
          mkdir -p dist/preview-v3
          cp -a "$RUNNER_TEMP/highfly-f0148-pristine/dist/." dist/
          cp -a "$RUNNER_TEMP/highfly-premium-v3-preview/." dist/preview-v3/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/preview-v3/index.html
          grep -q '/HIGHFLY-FREE-FOUNDATION/preview-v3/' dist/preview-v3/index.html
          grep -q '/HIGHFLY-FREE-FOUNDATION/assets/' dist/index.html
          echo "F0.14.8 stable root + v3 isolated /preview-v3/ ready for Pages."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/f014-premium-rpg-ui-lab' || github.ref == 'refs/heads/lab-f0148-phoenix-final-art-v3-20261120'
    environment:
      name: highfly-free-preview
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
