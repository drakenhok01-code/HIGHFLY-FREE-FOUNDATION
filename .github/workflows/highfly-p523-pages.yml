name: HIGHFLY P523 - Robust World Forge PNG + Map Diagnostics (Preserved Pages)
on:
  push:
    branches: [p523-world-forge-png-terrain-diagnostics-20261124]
    paths: ['.github/workflows/highfly-p523-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p523-preserved-pages
  cancel-in-progress: false
jobs:
  stage-site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download verified full P523 PNG terrain editor build
        uses: actions/download-artifact@v4
        with:
          name: highfly-p523-png-diagnostics
          run-id: 45502863117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p523-verified
      - name: Download published P522 site with all prior approved previews
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 45500765499
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p522-approved
      - name: Verify fixed editor and never overwrite older content
        shell: bash
        run: |
          set -euo pipefail
          GAME="$RUNNER_TEMP/p523-verified"
          for rel in index.html highfly/world-forge.js highfly/world-forge.html highfly/native-terrain-manifest.json highfly/native-terrain-core.png highfly/native-terrain-region.png highfly/native-relief-core.png highfly/native-relief-region.png highfly/native-overview.json world/world.json; do
            test -s "$GAME/$rel"
          done
          grep -q "native-terrain-manifest.json" "$GAME/highfly/world-forge.js"
          grep -q "diagnostics-toggle" "$GAME/highfly/world-forge.html"
          ! grep -q "DecompressionStream" "$GAME/highfly/world-forge.js"
          SITE="$RUNNER_TEMP/highfly-preserved-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/p522-approved/artifact.tar" -C "$SITE"
          for rel in index.html preview-v3/index.html preview-p514/index.html preview-p520/index.html preview-p521/index.html preview-p522/index.html; do test -s "$SITE/$rel"; done
          test ! -e "$SITE/preview-p523"
          (cd "$SITE" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/previous-hashes.sha256"
          mkdir "$SITE/preview-p523"
          cp -a "$GAME/." "$SITE/preview-p523/"
          (cd "$SITE" && sha256sum -c "$RUNNER_TEMP/previous-hashes.sha256" >/dev/null)
          touch "$SITE/.nojekyll"
          mv "$SITE" dist-pages
          echo "Original game and historical previews preserved byte-for-byte; P523 PNG-only map added"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: stage-site
    runs-on: ubuntu-latest
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish self-diagnosing PNG map separately
        id: deployment
        uses: actions/deploy-pages@v4
