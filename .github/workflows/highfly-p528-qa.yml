name: "HIGHFLY P528 - 3D World Forge Original Unsung QA"
on:
  push:
    branches: [p528-world-forge-complete-prefab-editor-20261125]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-p528-sims-world-forge-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen image tools
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Validate original/3D editor source, gameplay regressions and copyright gate
        run: |
          node --check scripts/f0-build.mjs
          node --check scripts/p522-native-world-export.mjs
          node --check src/highfly/p525-world-forge-3d.mjs
          node --check src/highfly/p528-village-layout.mjs
          node --check src/highfly/p528-village-decor-3d.mjs
          node --check public/highfly/world-forge.js
          node --test tests/p528-beginning-village.test.mjs tests/p526-sims-builder.test.mjs tests/p525-native-3d-world-forge.test.mjs tests/p524-free-kaykit-buildings.test.mjs tests/p523-png-terrain.test.mjs tests/p521-world-forge.test.mjs tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
          npm run qa:static
          npm run qa:gameplay
      - name: Build full HIGHFLY RPG and independent genuine original-world 3D editor
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p528/ npm run build
          npm run qa:dist
          for path in index.html highfly/world-forge.html highfly/world-forge-3d.html highfly/world-forge-3d.js highfly/native-architecture-3d.bin highfly/native-architecture-3d.json highfly/native-terrain-core.png highfly/native-terrain-region.png highfly/native-relief-core.png highfly/native-overview.json highfly/kaykit-free/manifest.json; do
            test -s "dist/$path"
          done
          grep -q 'preview-p528' dist/index.html
          grep -q 'WORLD FORGE' dist/highfly/world-forge-3d.html
          grep -q 'world-forge-3d.html' dist/highfly/world-forge.js
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/highfly/native-architecture-3d.json'));const b=fs.statSync('dist/highfly/native-architecture-3d.bin').size;if(m.meshes.length<55||m.totalTriangles<1000||b!==m.byteLength)throw Error('Original full 3D architecture incomplete');console.log('[P528 3D NATIVE]',m.meshes.length,'original structures,',m.totalTriangles,'native triangles,',b,'bytes')"
          node --input-type=module -e "import fs from 'node:fs';const f=JSON.parse(fs.readFileSync('dist/highfly/kaykit-free/manifest.json'));if(f.models.length!==16||f.license!=='CC0-1.0')throw Error('Official CC0 pack incomplete');console.log('[P528 KAYKIT]',f.models.length,'free authentic CC0 models')"
          ! grep -q 'DecompressionStream' dist/highfly/world-forge-3d.js
          ! git diff --name-only | grep -qE '^src/world/(layout|terrain|arch)/'
      - name: Real Chrome WebGL smoke test — 3D world must render before release
        run: |
          cp tests/p528-browser-beginning-village.mjs .work/unsung/tools/p528-browser-beginning-village.mjs
          cd .work/unsung
          node tools/p528-browser-beginning-village.mjs
      - name: Preserve screenshot of native 3D editor from CI browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p528-3d-browser-screenshot
          path: .work/unsung/p528-village-editor-smoke.png
          if-no-files-found: warn
          retention-days: 5
      - name: Save complete separate 3D preview artifact (no site overwrite)
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p528-native-3d-world-forge
          path: dist/
          retention-days: 5
          if-no-files-found: error
