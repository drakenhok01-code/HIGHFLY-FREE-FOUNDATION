name: HIGHFLY P555 — full regions playable Pages
on:
  push:
    branches: [experiment/guildhall-full-regions-p55]
    paths:
      - '.github/workflows/highfly-p555-full-regions-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p555-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare image dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-python"
          "$RUNNER_TEMP/highfly-python/bin/python" -m pip install --quiet pillow==12.0.0 numpy==2.3.4
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-python/bin/python" >> "$GITHUB_ENV"
      - name: Build actual RPG and editor
        run: |
          set -euo pipefail
          node --check src/highfly/p555-region-runtime.mjs
          node --check src/highfly/p553-continuous-region.mjs
          node --check src/highfly/p508-world-clock.mjs
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p55/ npm run build
          node scripts/p555-pages-regions.mjs
          test -s dist/index.html
          test -s dist/highfly/world-forge-3d.js
          grep -q 'preview-p55/' dist/index.html
          grep -q 'P555 streamed Guildhall region' dist/assets/*.js
          grep -q "search.get('hftime')||'auto'" src/highfly/p508-world-clock.mjs
          ! find dist -type f | grep -E '(KIT_COMPLETO|KAYKIT_SOURCE_EDITOR_V1_PRIVATE|fragmento_0[12]\.bin)'
      - uses: actions/upload-artifact@v4
        with:
          name: highfly-p555-playable-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore existing P543 Pages snapshot including old previews
        uses: actions/download-artifact@v4
        with:
          name: highfly-p543-natural-unique
          run-id: 45709414313
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: highfly-p555-playable-experimental
          path: new
      - name: Append experimental preview; retain original landing and stable builds
        run: |
          set -euo pipefail
          mkdir site
          TAR="$(find previous -name artifact.tar -type f -print -quit)"
          test -n "$TAR"
          tar -xf "$TAR" -C site
          test -s site/index.html
          test -s site/preview-p543/index.html
          test -s site/preview-p542/index.html
          test -s site/preview-p541/index.html
          test ! -e site/preview-p55
          cp -a new site/preview-p55
          touch site/.nojekyll
          SIZE="$(du -sb site | cut -f1)"
          if [ "$SIZE" -ge 950000000 ]; then
            echo "Site exceeds 950 MB; oldest P537 preview remains in original archived artifact, not live."
            rm -rf site/preview-p537
          fi
          SIZE="$(du -sb site | cut -f1)"
          echo "P555 Pages size: $SIZE bytes"
          test "$SIZE" -lt 950000000
          test -s site/preview-p55/highfly/regions/island-8.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: highfly-p555-pages
          path: site
      - name: Wait for artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            N="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="highfly-p555-pages")] | length' 2>/dev/null || echo 0)"
            if [ "$N" = 1 ]; then sleep 20; exit 0; fi
            sleep 6
          done
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: highfly-p555-pages
