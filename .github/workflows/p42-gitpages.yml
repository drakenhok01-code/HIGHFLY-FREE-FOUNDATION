name: HIGHFLY P4.2 - GitHub Pages isolated real-game preview
on:
  workflow_dispatch:
  push:
    branches: [p42-ui-polish-full-20261121]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-gitpages-p42-isolated-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install approved icon image tools
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Internal simulation / original gameplay regression
        run: |
          npm run qa:static
          npm run qa:gameplay
          node --test tests/rpg-core.test.mjs tests/rpg-equipment.test.mjs tests/itemization.test.mjs tests/system-dialog.test.mjs tests/p41-bag-loot.test.mjs tests/p42-ui.test.mjs
      - name: Build REAL Unsung P4.2 game at separate GitHub Pages subpath
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p42/ npm run build
          npm run qa:dist
          test -s dist/index.html
          grep -q '/HIGHFLY-FREE-FOUNDATION/preview-p42/' dist/index.html
          cp -a dist "$RUNNER_TEMP/highfly-p42-game"
      - name: Real-game Chromium and inventory interaction gates
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          cd .work/unsung
          npm install --no-save --no-package-lock playwright@1.57.0 --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium --with-deps
          node scripts/qa-rpg-browser.mjs
      - name: Restore LAST APPROVED GitHub Pages release BYTE-FOR-BYTE
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 44940857853
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/highfly-approved-pages-artifact
      - name: Prepare separate P4.2 URL without touching approved root or preview-v3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/highfly-approved-site"
          tar -xf "$RUNNER_TEMP/highfly-approved-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/highfly-approved-site"
          test -s "$RUNNER_TEMP/highfly-approved-site/index.html"
          test -s "$RUNNER_TEMP/highfly-approved-site/preview-v3/index.html"
          test -s "$RUNNER_TEMP/highfly-approved-site/preview-p41/index.html"
          ROOT_HASH="$(sha256sum "$RUNNER_TEMP/highfly-approved-site/index.html" | cut -d' ' -f1)"
          V3_HASH="$(sha256sum "$RUNNER_TEMP/highfly-approved-site/preview-v3/index.html" | cut -d' ' -f1)"
          P41_HASH="$(sha256sum "$RUNNER_TEMP/highfly-approved-site/preview-p41/index.html" | cut -d' ' -f1)"
          test ! -e "$RUNNER_TEMP/highfly-approved-site/preview-p42"
          mkdir "$RUNNER_TEMP/highfly-approved-site/preview-p42"
          cp -a "$RUNNER_TEMP/highfly-p42-game/." "$RUNNER_TEMP/highfly-approved-site/preview-p42/"
          test -s "$RUNNER_TEMP/highfly-approved-site/preview-p42/index.html"
          test "$(sha256sum "$RUNNER_TEMP/highfly-approved-site/index.html" | cut -d' ' -f1)" = "$ROOT_HASH"
          test "$(sha256sum "$RUNNER_TEMP/highfly-approved-site/preview-v3/index.html" | cut -d' ' -f1)" = "$V3_HASH"
          test "$(sha256sum "$RUNNER_TEMP/highfly-approved-site/preview-p41/index.html" | cut -d' ' -f1)" = "$P41_HASH"
          touch "$RUNNER_TEMP/highfly-approved-site/.nojekyll"
          mv "$RUNNER_TEMP/highfly-approved-site" dist-pages
          echo "Approved root, v3 and P4.1 retained byte-for-byte; only /preview-p42/ added."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish ONLY approved root + v3 + new P4.2 preview
        id: deployment
        uses: actions/deploy-pages@v4
