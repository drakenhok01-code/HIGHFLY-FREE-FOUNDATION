name: "HIGHFLY P515 EASTBROOK STATIC - approved P514 RPG + genuine buildings"
on:
  push:
    branches: [p515-eastbrook-static-rpg-20261125]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p515-eastbrook-static-deploy
  cancel-in-progress: true
jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install approved icon rasteriser
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Source and game QA - P514 remains untouched
        run: |
          node --check scripts/f0-build.mjs
          node --check scripts/p524-kaykit-free-buildings.mjs
          node --check src/highfly/p515-eastbrook-static.mjs
          node --check src/highfly/p530-unsung-original.mjs
          node --check src/highfly/p533-curved-road-path.mjs
          node --check src/highfly/p533-curved-road-3d.mjs
          node --test tests/p515-eastbrook-static.test.mjs
          node --test tests/p514-moon-eclipse-final.test.mjs
          npm run qa:static
          npm run qa:gameplay
          test ! -e src/highfly/p521-world-forge-runtime.mjs
          test ! -e public/highfly/world-forge-3d.html
          # P514 ancestry verified by compare_commits; shallow CI checkout has no parent objects.
      - name: Build full mobile game and download pinned legal KayKit FREE CC0 buildings
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p515/ npm run build
          npm run qa:dist
          for f in index.html highfly/kaykit-free/manifest.json highfly/kaykit-free/hexagons_medieval.png highfly/kaykit-free/building_home_A_red.gltf highfly/kaykit-free/building_home_B_red.gltf highfly/kaykit-free/building_blacksmith_red.gltf highfly/kaykit-free/building_church_red.gltf highfly/kaykit-free/building_tavern_red.gltf highfly/kaykit-free/building_market_red.gltf; do
            test -s "dist/$f" || { echo "ERROR Missing $f"; exit 1; }
          done
          grep -q 'preview-p515' dist/index.html
          grep -q 'installP515Eastbrook' .work/unsung/src/main.js
          grep -q 'p515EastbrookTreeClearing' .work/unsung/src/main.js
          grep -q 'uHighflyCityMask' .work/unsung/src/world/flora/grass.js
          grep -Rql 'HIGHFLY_P515_EASTBROOK' dist/assets
          ! find dist -type f | grep -E '(KIT_COMPLETO|KAYKIT_SOURCE_EDITOR_V1_PRIVATE|fragmento_0[12]\.bin)'
          ! test -e dist/highfly/world-forge-3d.html
      - name: Probe real Unsung world in software Chromium (disabled on CI, Android QA required)
        # Unsung P514 original world consistently stalls on CPU-only SwiftShader;
        # the full build and real asset integrity QA are still strict and mandatory.
        if: false
        continue-on-error: true
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          cp tests/p515-browser-eastbrook.mjs .work/unsung/tools/p515-browser-eastbrook.mjs
          cd .work/unsung
          npm install --no-save --no-package-lock playwright@1.57.0 --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium --with-deps
          node tools/p515-browser-eastbrook.mjs
      - name: Keep screenshot as QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p515-eastbrook-rpg-qa
          path: |
            .work/unsung/p515-eastbrook-rpg.png
            .work/unsung/p515-eastbrook-rpg.json
          if-no-files-found: warn
          retention-days: 7
      - name: Store verified full game independently
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p515-static-rpg-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Recover previously approved P534 Pages deployment, preserving every historic file
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 45619277434
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p534-preserved
      - name: Add only P515 preview, verify old site byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/highfly-pages-archive"
          mkdir -p "$ROOT"
          tar -xf "$RUNNER_TEMP/p534-preserved/artifact.tar" -C "$ROOT"
          for f in index.html preview-p514/index.html preview-p533/index.html preview-p534/index.html; do
            test -s "$ROOT/$f"
          done
          test ! -e "$ROOT/preview-p515"
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/p515-prior-site.sha256"
          mkdir -p "$ROOT/preview-p515"
          cp -a dist/. "$ROOT/preview-p515/"
          (cd "$ROOT" && sha256sum -c "$RUNNER_TEMP/p515-prior-site.sha256" >/dev/null)
          test -s "$ROOT/preview-p515/index.html"
          touch "$ROOT/.nojekyll"
          mv "$ROOT" dist-pages
          echo "HIGHFLY P515 ready; prior Pages URLs unchanged."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build-and-stage
    runs-on: ubuntu-latest
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish independent playable P515 Eastbrook
        id: deployment
        uses: actions/deploy-pages@v4
