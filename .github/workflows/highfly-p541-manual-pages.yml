name: "HIGHFLY P541 Manual World Forge — clean Unsung terrain and graded buildings"
on:
  push:
    branches: [p541-manual-world-forge-clean-20261125]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p541-clean-pages
  cancel-in-progress: true
jobs:
  arvelia-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare frozen image tool dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Strict static checks and focused Arvelia quests
        run: |
          node --check src/highfly/p538-eastbrook-land.mjs
          node --check src/highfly/p538-arvelia-quests.mjs
          node --check src/highfly/p525-world-forge-3d.mjs
          node --check src/highfly/p521-world-forge-runtime.mjs
          node --check scripts/f0-build.mjs
          node --check tests/p541-browser-manual.mjs
          node --test tests/p539-terrain-camera-prefabs.test.mjs
          node --test tests/p541-manual-revert.test.mjs
          node --test tests/p538-eastbrook-land.test.mjs
          node --test tests/p537-ground-fit.test.mjs
          node --test tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
      - name: Build P541 native P539-based manual RPG and World Forge 4.9; strict no-town checks
        shell: bash
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p541/ npm run build
          npm run qa:dist
          grep -q 'preview-p541' dist/index.html
          grep -q 'WORLD FORGE 4.9' dist/highfly/world-forge-3d.html
          grep -q 'hf-world-forge-layout-p541-manual-v1' .work/unsung/src/highfly/p525-world-forge-3d.mjs
          grep -q 'hf-world-forge-layout-p541-manual-v1' .work/unsung/src/highfly/p521-world-forge-runtime.mjs
          grep -q 'p538-eastbrook-land' .work/unsung/src/highfly/p525-world-forge-3d.mjs
          grep -q 'p538-arvelia-quests' .work/unsung/src/highfly/p521-world-forge-runtime.mjs
          test -s dist/highfly/native-overview.json
          test -s dist/highfly/world-forge-3d.js
          ! find dist -type f | grep -E '(KIT_COMPLETO|KAYKIT_SOURCE_EDITOR_V1_PRIVATE|fragmento_0[12]\.bin)'
      - name: "Chrome 3D native Unsung: no village, manually place house on slope, save and use camera"
        shell: bash
        run: |
          cp tests/p541-browser-manual.mjs .work/unsung/tools/p541-browser-manual.mjs
          cd .work/unsung
          timeout 530s node tools/p541-browser-manual.mjs
      - name: Upload terrain placement evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p541-manual-unsung-slope-evidence
          path: |
            .work/unsung/p541-editor-health.json
            .work/unsung/p541-manual-slope-evidence.json
            .work/unsung/p541-original-terrain-empty.png
            .work/unsung/p541-manual-slope-house.png
          if-no-files-found: warn
          retention-days: 7
      - name: Keep isolated PREVIEW BUILD only after strict tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p541-manual-unsung-graded
          path: dist/
          if-no-files-found: error
          retention-days: 10

  publish-pages:
    needs: [arvelia-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download newly tested P541 manual-graded World Forge and RPG
        uses: actions/download-artifact@v4
        with:
          name: highfly-p541-manual-unsung-graded
          path: ${{ runner.temp }}/p541-tested
      - name: Restore prior approved P539 as safe backup
        uses: actions/download-artifact@v4
        with:
          name: highfly-p539-arvelia-camera-slope
          run-id: 45687558253
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p539-approved
      - name: Restore previous P538 Arvelia backup
        uses: actions/download-artifact@v4
        with:
          name: highfly-p538-arvelia-world-forge
          run-id: 45681104388
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p538-approved
      - name: Restore previous P537 original backup
        uses: actions/download-artifact@v4
        with:
          name: highfly-p537-world-forge-45
          run-id: 45659850899
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p537-approved
      - name: Assemble approved P537/P538/P539 backups plus NEW manual P541; omit rejected P540
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p541-pages"
          for v in 537 538 539 541; do
            SRC="$RUNNER_TEMP/p${v}-approved"
            if [ "$v" = 541 ]; then SRC="$RUNNER_TEMP/p541-tested"; fi
            test -s "$SRC/index.html"
            test -s "$SRC/highfly/world-forge-3d.html"
            grep -q "preview-p${v}" "$SRC/index.html"
            mkdir -p "$ROOT/preview-p${v}"
            cp -a "$SRC/." "$ROOT/preview-p${v}/"
          done
          grep -q 'WORLD FORGE 4.9' "$ROOT/preview-p541/highfly/world-forge-3d.html"
          test -s "$ROOT/preview-p541/highfly/world-forge-3d.js"
          test -s "$ROOT/preview-p539/highfly/world-forge-3d.js"
          test -s "$ROOT/preview-p538/highfly/world-forge-3d.js"
          test -s "$ROOT/preview-p537/highfly/world-forge-3d.js"
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html>
          <html lang="es"><meta charset="utf-8"><title>HIGHFLY P5.4.1 — EDITOR MANUAL UNSUNG</title>
          <meta http-equiv="refresh" content="0;url=./preview-p541/">
          <a href="./preview-p541/">Entrar a HIGHFLY P5.4.1 · World Forge manual</a></html>
          HTML
          touch "$ROOT/.nojekyll"
          test ! -e "$ROOT/preview-p536"
          SIZE="$(du -sb "$ROOT" | cut -f1)"
          echo "P541 Pages size: $SIZE bytes"
          test "$SIZE" -lt 900000000 || { echo "::error::Pages exceeds 900MB"; exit 1; }
          mv "$ROOT" dist-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: highfly-p541-unique-pages-bundle
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: highfly-p541-unique-pages-bundle
