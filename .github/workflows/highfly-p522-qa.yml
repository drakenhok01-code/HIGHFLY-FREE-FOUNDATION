name: HIGHFLY P522 - Original Unsung Aerial Reference (Isolated QA)
on:
  push:
    branches: [p522-world-forge-actual-overview-20261124]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: highfly-p522-actual-world-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU image dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - name: Syntax, previous RPG tests and root-cause regression
        run: |
          node --check scripts/f0-build.mjs
          node --check scripts/p522-native-world-export.mjs
          node --check public/highfly/world-forge.js
          node --test tests/p521-world-forge.test.mjs tests/p515-climate-options.test.mjs tests/p514-moon-eclipse-final.test.mjs
          node -e "const s=require('fs').readFileSync('public/highfly/world-forge.js','utf8');if(s.includes('../../world/'))throw Error('Wrong root URL reintroduced');if(!s.includes('../world/'))throw Error('Missing correct local world path')"
          npm run qa:static
          npm run qa:gameplay
      - name: Build authentic native world projection and real RPG
        run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p522/ npm run build
          npm run qa:dist
          test -s dist/index.html
          test -s dist/highfly/world-forge.html
          test -s dist/highfly/world-forge.js
          test -s dist/highfly/native-overview.json
          test -s dist/highfly/native-trees-core.png
          test -s dist/highfly/native-trees-region.png
          test -s dist/highfly/native-architecture-core.png
          test -s dist/highfly/native-architecture-region.png
          node --input-type=module -e "import fs from 'node:fs';const w=JSON.parse(fs.readFileSync('dist/highfly/native-overview.json'));if(w.trees.length<100||w.structureTriangles<100||w.routes.length<10||w.spires.length!==8)throw Error('Original native overview incomplete: '+JSON.stringify({trees:w.trees.length,structures:w.structureTriangles,spires:w.spires.length,routes:w.routes.length}));console.log('PASS native site/forest instance/roof projection:',w.trees.length,'trees,',w.structureTriangles,'triangles');"
          test "$(find dist/highfly -name '*native-*png' | wc -l)" = 4
          grep -q 'preview-p522' dist/index.html
          ! git diff --name-only | grep -qE '^src/world/(layout|terrain|arch)/'
      - name: Upload safe non-deployed test bundle
        uses: actions/upload-artifact@v4
        with:
          name: highfly-p522-native-overview-qa
          path: dist/
          if-no-files-found: error
          retention-days: 5
