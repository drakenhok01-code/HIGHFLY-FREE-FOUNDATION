name: P542 Guildhall isolated build (no Pages deployment)
on:
  push:
    branches: [lab-p542-guildhall-prefabs-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/highfly/p525-world-forge-3d.mjs
          node --check src/highfly/p521-world-forge-runtime.mjs
          node --test tests/p542-guildhall.test.mjs
      - run: |
          python3 -m venv "$RUNNER_TEMP/highfly-icons-env"
          "$RUNNER_TEMP/highfly-icons-env/bin/python" -m pip install --quiet "pillow==12.0.0" "numpy==2.3.4"
          echo "HIGHFLY_ICON_PYTHON=$RUNNER_TEMP/highfly-icons-env/bin/python" >> "$GITHUB_ENV"
      - run: |
          HIGHFLY_PAGES_BASE=/HIGHFLY-FREE-FOUNDATION/preview-p542/ npm run build
          npm run qa:dist
          test -s dist/highfly/world-forge-3d.js
          grep -q 'guildhall-place' dist/highfly/world-forge-3d.html
      - uses: actions/upload-artifact@v4
        with:
          name: highfly-p542-guildhall-lab
          path: dist/
          retention-days: 7
