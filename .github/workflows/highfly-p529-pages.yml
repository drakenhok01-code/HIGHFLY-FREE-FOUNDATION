name: "HIGHFLY P529 - Pueblo de los Inicios Android Editor + Play"
on:
  push:
    branches: [p529-private-kaykit-source-import-20261125]
    paths: ['.github/workflows/highfly-p529-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: highfly-p529-pages-safe
  cancel-in-progress: false
jobs:
  stage-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Retrieve P529 release only after successful complete browser smoke and game build
        uses: actions/download-artifact@v4
        with:
          name: highfly-p529-native-3d-world-forge
          run-id: 45541338125
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p529-chrome-validated
      - name: Recover previously published P527 site including all old approved versions
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 45529742661
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p527-approved-site
      - name: Verify P529 game, source-pack privacy and exact original Unsung assets
        shell: bash
        run: |
          set -euo pipefail
          GAME="$RUNNER_TEMP/p529-chrome-validated"
          for path in index.html highfly/world-forge.html highfly/world-forge.js highfly/world-forge-3d.html highfly/world-forge-3d.js highfly/native-architecture-3d.bin highfly/native-architecture-3d.json highfly/native-terrain-core.png highfly/native-terrain-region.png highfly/native-overview.json highfly/kaykit-free/manifest.json; do
            test -s "$GAME/$path" || { echo "FAIL: Missing P529 $path"; exit 1; }
          done
          grep -q 'preview-p529' "$GAME/index.html"
          grep -q 'WORLD FORGE · 3D V0.9' "$GAME/highfly/world-forge-3d.html"
          grep -q 'p529' "$GAME/highfly/world-forge-3d.js"
          GAME="$GAME" node --input-type=module -e "import fs from 'node:fs';const p=process.env.GAME;const m=JSON.parse(fs.readFileSync(p+'/highfly/native-architecture-3d.json'));const k=JSON.parse(fs.readFileSync(p+'/highfly/kaykit-free/manifest.json'));if(m.meshes.length!==73||m.totalTriangles<800000||fs.statSync(p+'/highfly/native-architecture-3d.bin').size!==m.byteLength||k.license!=='CC0-1.0'||k.models.length!==16)throw Error('P529 missing real Unsung or KayKit CC0 geometry');console.log('P529 PASS: authentic Unsung architecture and 16 real KayKit FREE building models');"
          test ! -e "$GAME/KIT_COMPLETO_PARTE_01.zip"
          test ! -e "$GAME/KIT_COMPLETO_PARTE_02.zip"
          test ! -e "$GAME/HIGHFLY_KAYKIT_SOURCE_EDITOR_V1_PRIVATE.zip"
          SITE="$RUNNER_TEMP/highfly-historical-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/p527-approved-site/artifact.tar" -C "$SITE"
          for rel in index.html preview-v3/index.html preview-p514/index.html preview-p520/index.html preview-p521/index.html preview-p522/index.html preview-p523/index.html preview-p524/index.html preview-p525/index.html preview-p526/index.html preview-p527/index.html; do
            test -s "$SITE/$rel" || { echo "FAIL: Historical HIGHFLY file missing: $rel"; exit 1; }
          done
          test ! -e "$SITE/preview-p529"
          (cd "$SITE" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/unchanged-older-versions.sha256"
          mkdir -p "$SITE/preview-p529"
          cp -a "$GAME/." "$SITE/preview-p529/"
          (cd "$SITE" && sha256sum -c "$RUNNER_TEMP/unchanged-older-versions.sha256" >/dev/null)
          touch "$SITE/.nojekyll"
          mv "$SITE" dist-pages
          echo "P529 SAFE: Previous live files unchanged. New playable village added at preview-p529."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: stage-site
    runs-on: ubuntu-latest
    environment:
      name: highfly-free-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated P529 original Unsung RPG and World Forge 3D
        id: deployment
        uses: actions/deploy-pages@v4
