<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HIGHFLY WORLD FORGE · Editor de mapa</title>
<style>
:root{color-scheme:dark;--gold:#e8cc91;--purple:#bd95ee;--bg:#11101c}
*{box-sizing:border-box}
body{margin:0;background:#0b0d15;color:#f2edff;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;overflow:hidden}
button,select{font:inherit;cursor:pointer;touch-action:manipulation}
button{border:1px solid #6a5885;border-radius:8px;background:#271d3b;color:#f7f0ff;padding:8px 10px}
button:active{transform:translateY(1px)}button.active{border-color:#e3c689;background:#573771;box-shadow:0 0 0 1px #c697ff55 inset}
button:disabled{opacity:.4;cursor:not-allowed}
#app{height:100dvh;height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{height:51px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:5px 13px;background:#1b1430;border-bottom:1px solid #6b4b8f;gap:10px}
.brand{font-weight:900;color:var(--gold);letter-spacing:.06em;white-space:nowrap}.brand small{display:block;font-weight:500;color:#c7aff0;font-size:10px;letter-spacing:.15em}
.head-actions{display:flex;gap:6px;align-items:center;overflow-x:auto}
.head-actions button{white-space:nowrap}
main{display:flex;flex:1;min-height:0}
aside{width:235px;flex:none;background:#161327;border-right:1px solid #4f416d;display:flex;flex-direction:column;min-height:0}
aside h2{font-size:12px;color:var(--gold);padding:9px 10px 6px;margin:0}
#categories{display:flex;gap:4px;padding:3px 7px 8px;overflow-x:auto;scrollbar-width:thin}
#categories button{white-space:nowrap;font-size:11px;padding:5px 7px}
#catalog{flex:1;min-height:0;overflow-y:auto;padding:5px 7px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:7px;overscroll-behavior:contain;touch-action:pan-y}
.asset{min-height:70px;padding:8px 4px;background:linear-gradient(145deg,#252038,#121724);border-color:#4a425a}
.asset strong{display:block;font-size:23px;margin-bottom:3px}.asset span{font-size:11px;display:block}
#properties{padding:10px;min-height:90px;max-height:35%;overflow:auto;border-top:1px solid #55406d;touch-action:pan-y}
#properties b{display:block;color:var(--gold);margin-bottom:6px}
#properties small{display:block;color:#beaecd;margin-bottom:5px}
#properties input{max-width:90px;background:#130f20;border:1px solid #8067a7;color:white;border-radius:5px;padding:3px}
#properties .controls{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#viewport{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:#2c493e}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.toolbar{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:auto;max-width:calc(100% - 105px)}
.toolbar button{background:#17152bea;backdrop-filter:blur(6px);font-size:12px;padding:7px 9px}
#hud{position:absolute;right:9px;top:8px;text-align:right;pointer-events:none;color:white;text-shadow:0 1px 3px black;font-size:11px}
#status{position:absolute;left:8px;bottom:7px;background:#161428dc;border:1px solid #655485;border-radius:7px;max-width:90%;padding:5px 9px;font-size:11px;pointer-events:none}
#info{position:absolute;right:8px;bottom:8px;font-size:11px;color:#f7e6be;text-align:right;text-shadow:0 2px 3px black;pointer-events:none}
#io-file{display:none}
@media(max-width:760px){header{height:43px;padding:4px 7px}.brand{font-size:11px}.brand small{font-size:8px}button{padding:5px 6px;font-size:11px}aside{width:165px}aside h2{padding:6px;font-size:11px}#catalog{gap:4px}.asset{min-height:58px}.asset strong{font-size:17px}#properties{padding:5px;max-height:38%}.toolbar button{padding:5px 6px;font-size:10px}.toolbar{top:6px;left:5px}#status{font-size:10px;max-width:80%}.head-actions{gap:3px}}
@media(max-height:410px){header{height:39px}.asset{min-height:54px}aside{width:163px}#categories{padding:2px 4px}#properties{min-height:55px}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand">✦ HIGHFLY <small>WORLD FORGE · V0.1</small></div>
 <div class="head-actions">
  <button id="undo" title="Deshacer">↶</button><button id="redo" title="Rehacer">↷</button>
  <button id="save">💾 Guardar</button><button id="export">↓ JSON</button><button id="import">↑ Importar</button>
  <button id="play">▶ Ver en juego</button>
 </div>
</header>
<main>
<aside>
 <h2>CATÁLOGO DE MUNDO</h2>
 <div id="categories" aria-label="Categorías"></div>
 <div id="catalog" aria-label="Objetos para construir"></div>
 <div id="properties"><b>CONTROLES</b><small>Elegí un objeto y tocá el mapa para colocarlo. Para moverlo, tocá SELECCIONAR y arrastralo.</small><div class="controls"><button id="rotate-left">↺ 15°</button><button id="rotate-right">↻ 15°</button><button id="scale-down">− Tamaño</button><button id="scale-up">+ Tamaño</button><button id="delete">🗑 Borrar</button></div></div>
</aside>
<div id="viewport">
 <canvas id="map" aria-label="Mapa real de altura de Unsung, editor aéreo"></canvas>
 <div class="toolbar"><button id="select" class="active">▣ Seleccionar</button><button id="pan">✋ Mover mapa</button><button id="grid">▦ Cuadrícula</button><button id="zoom-in">＋</button><button id="zoom-out">－</button><button id="home">⌖ Inicio</button></div>
 <div id="hud"><div id="coord">X — · Z —</div><div id="height">Altura real: —</div><div id="items">0 objetos</div></div>
 <div id="status">Cargando mapa auténtico de Unsung…</div>
 <div id="info">Piso: arrastrá para trazar camino · Rueda o pellizco: zoom</div>
</div>
</main>
<input id="io-file" type="file" accept="application/json,.json">
</div>
<script type="module" src="./world-forge.js"></script>
</body>
</html>
